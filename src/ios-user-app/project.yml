name: MenuFitUserApp
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp
    DEVELOPMENT_TEAM: "Jorn Brem"
    CODE_SIGN_STYLE: Automatic
targets:
  MenuFitUserApp:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MenuFit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        MenuFitBackendBaseURL: $(MENUFIT_BACKEND_BASE_URL)
        SupabaseProjectURL: $(SUPABASE_PROJECT_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        MenuFitUserAccessToken: ""
        MenuFitUserSubjectId: ios-user
        MenuFitPicnicAccountId: picnic-default
        MenuFitHouseholdId: default-household
        MenuFitUserTokenExpiryEpochSeconds: 0
    entitlements:
      path: App/MenuFitUserApp.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    configFiles:
      Debug: Config/AppConfig.xcconfig
      Release: Config/AppConfig.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MenuFitWidgetExtension
        embed: true
      - target: MenuFitWatchApp
        embed: true

  MenuFitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MenuFitWidget
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MenuFitWidget/MenuFitWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.widget
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  MenuFitWatchApp:
    type: application.watchapp2
    platform: watchOS
    info:
      path: MenuFitWatch/Info.plist
      properties:
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: nl.menufit.userapp
    entitlements:
      path: MenuFitWatch/MenuFitWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.watchkitapp
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
    dependencies:
      - target: MenuFitWatchExtension
        embed: true
      - target: MenuFitWatchWidgetExtension
        embed: true

  MenuFitWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: MenuFitWatchExtension
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWatchExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.watchkit
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ExtensionDelegate
          NSExtensionAttributes:
            WKAppBundleIdentifier: nl.menufit.userapp.watchkitapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.watchkitapp.watchkitextension
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  MenuFitWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: MenuFitWatchWidget
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MenuFitWatchWidget/MenuFitWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.watchkitapp.widget
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  MenuFitUserAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MenuFitUserApp
    settings:
      base:
        TEST_TARGET_NAME: MenuFitUserApp
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

schemes:
  MenuFitUserApp:
    build:
      targets:
        MenuFitUserApp: all
        MenuFitWidgetExtension: all
    test:
      targets:
        - name: MenuFitUserAppUITests
  MenuFitWatchApp:
    build:
      targets:
        MenuFitWatchApp: all
        MenuFitWatchExtension: all
        MenuFitWatchWidgetExtension: all
