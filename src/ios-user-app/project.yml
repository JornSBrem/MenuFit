name: MenuFitUserApp
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MenuFitUserApp:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MenuFit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        MenuFitBackendBaseURL: https://app.menufit.uk
        MenuFitUserAccessToken: ""
        MenuFitUserSubjectId: ios-user
        MenuFitPicnicAccountId: picnic-default
        MenuFitHouseholdId: default-household
        MenuFitUserTokenExpiryEpochSeconds: 0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MenuFitUserAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MenuFitUserApp
    settings:
      base:
        TEST_TARGET_NAME: MenuFitUserApp
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

schemes:
  MenuFitUserApp:
    build:
      targets:
        MenuFitUserApp: all
    test:
      targets:
        - name: MenuFitUserAppUITests
