name: MenuFitUserApp
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MenuFitUserApp:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MenuFit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        MenuFitBackendBaseURL: https://app.menufit.uk
        MenuFitUserAccessToken: ""
        MenuFitUserSubjectId: ios-user
        MenuFitPicnicAccountId: picnic-default
        MenuFitHouseholdId: default-household
        MenuFitUserTokenExpiryEpochSeconds: 0
    entitlements:
      path: App/MenuFitUserApp.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MenuFitWidgetExtension
        embed: true
      - target: MenuFitWatchApp
        embed: true

  MenuFitWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MenuFitWidget
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWidget/Info.plist
    entitlements:
      path: MenuFitWidget/MenuFitWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.widget
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  MenuFitWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: MenuFitWatch
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWatch/Info.plist
    entitlements:
      path: MenuFitWatch/MenuFitWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.watchkitapp
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
    dependencies:
      - target: MenuFitWatchWidgetExtension
        embed: true

  MenuFitWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: MenuFitWatchWidget
      - path: App/SharedWidgetData.swift
      - path: App/MealSchedule.swift
    info:
      path: MenuFitWatchWidget/Info.plist
    entitlements:
      path: MenuFitWatchWidget/MenuFitWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.nl.menufit.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.menufit.userapp.watchkitapp.widget
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  MenuFitUserAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MenuFitUserApp
    settings:
      base:
        TEST_TARGET_NAME: MenuFitUserApp
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

schemes:
  MenuFitUserApp:
    build:
      targets:
        MenuFitUserApp: all
        MenuFitWidgetExtension: all
    test:
      targets:
        - name: MenuFitUserAppUITests
  MenuFitWatchApp:
    build:
      targets:
        MenuFitWatchApp: all
        MenuFitWatchWidgetExtension: all
