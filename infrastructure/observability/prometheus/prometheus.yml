global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: menufit-backend
    metrics_path: /api/v3/observability/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/menufit_observability_token
    static_configs:
      - targets:
          - backend.projectgezond.nl
        labels:
          service: menufit-backend
          environment: prod
