# MenuFit — nginx configuratie
#
# Eenmalige setup op de container:
#   ln -sf /opt/menufit/infra/nginx-menufit.conf /etc/nginx/sites-enabled/menufit
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Statische bestanden van de admin web app
    root /opt/menufit/src/admin-web/app/dist;
    index index.html;

    # Proxy API en health-check naar de Node backend
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA: stuur alle andere paden naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
