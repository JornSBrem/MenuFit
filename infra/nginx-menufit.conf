# MenuFit — nginx configuratie (HTTPS)
#
# Eenmalige setup op de container:
#   bash /opt/menufit/infra/setup-container.sh

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/menufit.crt;
    ssl_certificate_key /etc/nginx/ssl/menufit.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

    # Statische bestanden van de admin web app
    root /opt/menufit/src/admin-web/app/dist;
    index index.html;

    # Proxy API en health-check naar de Node backend
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA: stuur alle andere paden naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
